<!doctype html>
<meta charset="utf-8">
<!-- Turns ../cover.png into targets.mind with MindAR's own compiler. Opened by tools/compile.py. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script>
window.compileCover = async () => {
  const img = new Image();
  img.src = "../cover.png";
  await img.decode();
  const compiler = new window.MINDAR.IMAGE.Compiler();
  await compiler.compileImageTargets([img], () => {});
  const bytes = new Uint8Array(await compiler.exportData());
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};
</script>
